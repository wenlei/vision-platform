services:
  vision-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: vision-inference:gpu
    container_name: vision-inference-gpu
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - 8000:8000
    env_file:
      - ../.env                # DB_PASS etc. (git-ignored)
    environment:
      DEVICE: gpu
      DB_HOST: 192.168.50.118
      DB_PORT: 5432
      DB_USER: wenlei
      DB_PASS: ${DB_PASS}      # from .env
      DB_NAME: vision_db
      IMAGE_STORAGE: retention
      IMAGE_RETENTION_HOURS: 48
      NAS_PATH: /app/images
      HF_ENDPOINT: https://hf-mirror.com
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    volumes:
      - vision_images:/app/images
      - ../UI:/app/UI
      - ../api:/app/api
      - ../app-runtime.yaml:/app/app-runtime.yaml

volumes:
  vision_images:
    driver: local
